services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: campusfix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusfix_local}
      POSTGRES_DB: campusfix
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - campusfix_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusfix"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: campusfix-api:local
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      NODE_ENV: development
      DATABASE_URL: postgres://campusfix:${POSTGRES_PASSWORD:-campusfix_local}@db:5432/campusfix
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  web:
    image: campusfix-web:local
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "127.0.0.1:8095:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

volumes:
  campusfix_data:
