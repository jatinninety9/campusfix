name: CampusFix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    name: Tests and Docker verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CI: "true"
      BASE_URL: http://127.0.0.1:8095
      BROWSER_CHANNEL: chromium

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate deployment script
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/deploy-ec2.sh

          for invalid_sha in "" "main" "invalid"; do
            if bash scripts/deploy-ec2.sh "$invalid_sha"; then
              echo "ERROR: Deployment script accepted an invalid commit."
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare test configuration
        run: cp .env.example .env

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Build React
        run: npm run build

      - name: Build images and start containers
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Verify non-root image with restrictive source permissions
        run: python3 scripts/test-image-permissions.py

      - name: Initialize temporary database and sample accounts
        run: npm run db:init

      - name: Run backend integration tests
        run: npm test

      - name: Check application health through Nginx
        run: curl --fail --show-error http://127.0.0.1:8095/api/health

      - name: Check deployed assets and API routing through Nginx
        run: npm run test:deployment

      - name: Run browser workflow against containers
        run: npm run test:browser

      - name: Check production labels and report refresh races
        run: npm run test:ui

      - name: Show diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100

      - name: Remove temporary CI containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans

  deploy:
    name: Deploy to AWS EC2
    needs: verify
    if: github.repository == 'jatinninety9/campusfix' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    permissions:
      contents: read
      id-token: write

    concurrency:
      group: campusfix-production
      cancel-in-progress: false

    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_SHA: ${{ github.sha }}
      AWS_PAGER: ""

    steps:
      - name: Check out tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: "974284323787"
          role-session-name: campusfix-deployment

      - name: Prepare deployment command
        shell: bash
        run: |
          python3 <<'PY'
          import base64
          import json
          import os
          import pathlib
          import re
          import shlex

          sha = os.environ["DEPLOY_SHA"]
          assert re.fullmatch(r"[0-9a-f]{40}", sha)

          script = pathlib.Path("scripts/deploy-ec2.sh").read_bytes()
          assert b"\r" not in script, "Deployment script must use LF endings"
          encoded = base64.b64encode(script).decode("ascii")

          command = (
              "set -eu; "
              "script_file=$(mktemp /tmp/campusfix-deploy.XXXXXX); "
              "trap 'rm -f \"$script_file\"' EXIT; "
              f"printf '%s' {shlex.quote(encoded)} "
              "| base64 --decode > \"$script_file\"; "
              "chmod 644 \"$script_file\"; "
              f"sudo -u ubuntu bash \"$script_file\" {shlex.quote(sha)}"
          )

          pathlib.Path("/tmp/deploy-command.json").write_text(
              json.dumps({
                  "commands": [command],
                  "executionTimeout": ["1800"]
              })
          )
          PY

      - name: Deploy through SSM and read result
        shell: bash
        run: |
          set -euo pipefail

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters file:///tmp/deploy-command.json \
            --timeout-seconds 120 \
            --query Command.CommandId \
            --output text)

          echo "SSM command: $command_id"
          echo "Deploying commit: $DEPLOY_SHA"

          for attempt in $(seq 1 210); do
            if aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" \
              --output json \
              > /tmp/deploy-result.json 2>/tmp/deploy-error.txt; then

              status=$(jq -r '.Status' /tmp/deploy-result.json)

              case "$status" in
                Success)
                  jq '{Status,ResponseCode,StandardOutputContent,StandardErrorContent}' \
                    /tmp/deploy-result.json
                  exit 0
                  ;;
                Pending|InProgress|Delayed)
                  ;;
                *)
                  jq '{Status,ResponseCode,StandardOutputContent,StandardErrorContent}' \
                    /tmp/deploy-result.json
                  exit 1
                  ;;
              esac
            elif ! grep -q InvocationDoesNotExist /tmp/deploy-error.txt; then
              cat /tmp/deploy-error.txt
              exit 1
            fi

            sleep 10
          done

          echo "ERROR: Timed out waiting for deployment."
          echo "Inspect SSM command $command_id before retrying."
          exit 1

      - name: Set up Node.js for public checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Verify public application
        env:
          BASE_URL: https://5660a4uet5.execute-api.ap-south-1.amazonaws.com
        run: node scripts/deployment-smoke.js
